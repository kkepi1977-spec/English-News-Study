<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>진우의 매일 영어 뉴스 공부</title>
<style>
  :root {
    --bg-page: #0f172a;
    --bg-card: #1e293b;
    --bg-card-hover: #334155;
    --border: #334155;
    --border-active: #38bdf8;
    --text-primary: #f8fafc;
    --text-secondary: #94a3b8;
    --text-highlight: #38bdf8;
    --accent: #38bdf8;
    --accent-gold: #fbbf24;
    --accent-green: #34d399;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    background: var(--bg-page);
    color: var(--text-primary);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    padding: 16px;
    padding-bottom: 80px;
    max-width: 600px;
    margin: 0 auto;
  }
  header {
    margin-bottom: 20px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  header h1 { font-size: 20px; font-weight: 800; color: #fff; }
  header p { font-size: 13px; color: var(--text-secondary); margin-top: 4px; }
  .badge { background: #0284c7; color: #fff; font-size: 11px; font-weight: 700; padding: 4px 8px; border-radius: 999px; }

  /* Tabs */
  .tabs { display: flex; gap: 8px; margin-bottom: 18px; }
  .tab-btn {
    flex: 1;
    padding: 12px 0;
    text-align: center;
    border-radius: 12px;
    background: #1e293b;
    color: var(--text-secondary);
    border: 1px solid var(--border);
    cursor: pointer;
    font-size: 15px;
    font-weight: 600;
    transition: all .2s;
  }
  .tab-btn.active {
    background: #0284c7;
    color: #fff;
    border-color: #38bdf8;
    box-shadow: 0 4px 12px rgba(2,132,199,.3);
  }

  /* News Card */
  .news-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 16px;
    cursor: pointer;
    transition: transform .15s, border-color .15s;
  }
  .news-card:active { transform: scale(0.99); }
  .news-date { font-size: 12px; font-weight: 700; color: var(--accent); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; }
  .news-headline { font-size: 19px; font-weight: 700; line-height: 1.4; color: #fff; margin-bottom: 10px; }
  .news-summary-kr { font-size: 14px; color: var(--text-secondary); line-height: 1.5; border-left: 3px solid #38bdf8; padding-left: 10px; margin-top: 8px; }
  .card-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 14px; font-size: 12px; color: #64748b; }

  /* Detail View */
  .detail-view {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 22px;
  }
  .detail-top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
    gap: 8px;
  }
  .back-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: #334155;
    color: #f1f5f9;
    border: none;
    border-radius: 8px;
    padding: 8px 14px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }
  .del-news-btn {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    background: rgba(239, 68, 68, 0.15);
    border: 1px solid rgba(239, 68, 68, 0.35);
    color: #f87171;
    border-radius: 8px;
    padding: 7px 12px;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.2s, border-color 0.2s;
  }
  .del-news-btn:hover, .del-news-btn:active {
    background: rgba(239, 68, 68, 0.28);
    border-color: #ef4444;
    color: #fca5a5;
  }

  .news-card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 6px;
  }
  .card-del-btn {
    display: inline-flex;
    align-items: center;
    gap: 3px;
    background: rgba(239, 68, 68, 0.12);
    border: 1px solid rgba(239, 68, 68, 0.28);
    color: #f87171;
    border-radius: 6px;
    padding: 3px 8px;
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
  }
  .card-del-btn:hover, .card-del-btn:active {
    background: rgba(239, 68, 68, 0.25);
    color: #fca5a5;
  }

  .restore-btn {
    background: transparent;
    border: 1px dashed #334155;
    color: #94a3b8;
    border-radius: 8px;
    padding: 8px 16px;
    font-size: 12px;
    cursor: pointer;
    transition: color 0.2s, border-color 0.2s;
  }
  .restore-btn:hover {
    color: #38bdf8;
    border-color: #38bdf8;
  }
  .detail-headline { font-size: 22px; font-weight: 800; line-height: 1.35; color: #fff; margin-bottom: 12px; }
  .detail-meta { font-size: 12px; color: var(--text-secondary); margin-bottom: 18px; display: flex; gap: 12px; align-items: center; }
  
  .audio-btn {
    background: #059669;
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 6px 12px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .youtube-btn {
    background: #dc2626;
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 6px 12px;
    font-size: 13px;
    font-weight: 600;
    text-decoration: none;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: background 0.2s;
  }
  .youtube-btn:hover { background: #b91c1c; }
  .yt-badge {
    display: inline-flex;
    align-items: center;
    gap: 3px;
    background: rgba(220, 38, 38, 0.2);
    color: #f87171;
    border: 1px solid rgba(220, 38, 38, 0.4);
    font-size: 11px;
    padding: 2px 6px;
    border-radius: 4px;
    font-weight: 600;
    margin-left: 6px;
  }
  .tip-box {
    background: #0f172a;
    border-left: 4px solid var(--accent-gold);
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 13px;
    color: #fde68a;
    margin-bottom: 20px;
    line-height: 1.5;
  }

  .para {
    font-size: 17px;
    line-height: 1.8;
    margin-bottom: 18px;
    color: #f1f5f9;
  }
  .w {
    display: inline-block;
    cursor: pointer;
    border-radius: 4px;
    padding: 1px 3px;
    transition: background .15s;
  }
  .w:hover, .w:active { background: #0284c7; color: #fff; }
  .w.saved {
    background: rgba(56, 189, 248, 0.2);
    border-bottom: 2px solid var(--accent);
    color: #38bdf8;
    font-weight: 600;
  }

  .kr-box {
    background: #0f172a;
    border-radius: 12px;
    padding: 16px;
    margin-top: 24px;
    border: 1px dashed #334155;
  }
  .kr-box-title { font-size: 13px; font-weight: 700; color: #38bdf8; margin-bottom: 8px; }
  .kr-box p { font-size: 14px; color: #cbd5e1; line-height: 1.6; }

  /* Vocab View */
  .vcard {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 12px;
    position: relative;
  }
  .vword { font-size: 19px; font-weight: 800; color: #38bdf8; display: flex; align-items: center; gap: 8px; }
  .vdef { margin-top: 8px; color: #f1f5f9; font-size: 15px; line-height: 1.5; }
  .vsrc { margin-top: 10px; color: #64748b; font-size: 12px; }
  .vdel {
    position: absolute;
    top: 16px;
    right: 16px;
    background: #334155;
    border: none;
    color: #94a3b8;
    font-size: 12px;
    padding: 4px 8px;
    border-radius: 6px;
    cursor: pointer;
  }

  .toast {
    position: fixed;
    left: 50%;
    bottom: 30px;
    transform: translateX(-50%);
    background: #0284c7;
    color: #fff;
    border-radius: 999px;
    padding: 12px 24px;
    box-shadow: 0 8px 24px rgba(0,0,0,.4);
    font-size: 14px;
    font-weight: 700;
    opacity: 0;
    transition: opacity .25s;
    pointer-events: none;
    z-index: 1000;
  }
  .toast.show { opacity: 1; }
  .empty { text-align: center; color: #64748b; padding: 60px 20px; font-size: 15px; line-height: 1.6; }
</style>
</head>

  <div>

let vocabList = JSON.parse(localStorage.getItem('news_vocab_list')) || DEFAULT_VOCAB;
DEFAULT_VOCAB.forEach(dv => {
  if (!vocabList.some(v => v.word.toLowerCase() === dv.word.toLowerCase())) {
    vocabList.unshift(dv);
  }
});

let currentOpenDate = "2026-11-18";

function saveStorage() {
  localStorage.setItem('news_study_list', JSON.stringify(newsList));
  localStorage.setItem('news_vocab_list', JSON.stringify(vocabList));
  document.getElementById('vocab-count').textContent = vocabList.length;
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1600);
}

function isSaved(word) {
  return vocabList.some(v => v.word.toLowerCase() === word.toLowerCase());
}

function speak(text) {
  if ('speechSynthesis' in window) {
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US';
    u.rate = 0.85; // 조금 천천히 듣기 편한 속도
    window.speechSynthesis.speak(u);
  } else {
    toast('이 브라우저는 음성 재생을 지원하지 않습니다.');
  }
}

function speakNews(date) {
  const n = newsList.find(x => x.date === date);
  if (n) speak(n.headline + '. ' + n.body);
}

function renderNews() {
  const container = document.getElementById('news-container');
  if (currentOpenDate) {
    const n = newsList.find(x => x.date === currentOpenDate) || newsList[0];
    if (!n) { currentOpenDate = null; renderNews(); return; }

    const rawSentences = n.body.split('!').map(s => s.trim()).filter(Boolean);
    const parsedHtml = rawSentences.map(sen => {
      const words = sen.split(/\s+/).map(w => {
        const clean = w.replace(/[^a-zA-Z]/g, '');
        const savedCls = isSaved(clean) ? ' saved' : '';
        return `<span class="w${savedCls}" onclick="toggleWord('${clean}', '${n.headline}')">${w}</span>`;
      }).join(' ');
      return `<p class="para">${words}</p>`;
    }).join('');

    container.innerHTML = `
      <div class="detail-view">
        <div class="detail-top-bar">
          <button class="back-btn" onclick="currentOpenDate=null; renderNews();">← 뉴스 목록으로</button>
          <button class="del-news-btn" onclick="deleteNews('${n.date}')">🗑️ 이 뉴스 삭제 (마스터 완료)</button>
        </div>
        <div class="news-date">📅 ${n.date} · [${n.field}]</div>
        <div class="detail-headline">${n.headline}</div>
        <div class="detail-meta">
          <button class="audio-btn" data-date="${n.date}" onclick="speakNews(this.dataset.date)">🔊 영어로 듣기</button>
          ${n.youtubeUrl ? `<a href="${n.youtubeUrl}" target="_blank" rel="noopener noreferrer" class="youtube-btn">📺 유튜브 원본 영상 보기</a>` : ''}
        </div>
        <div class="tip-box">
          💡 <strong>단어 공부 팁:</strong> 본문에서 모르는 영어 단어를 터치하면 바로 <strong>[단어장]</strong>에 자동 저장됩니다!
        </div>
        ${parsedHtml}
        <div class="kr-box">
          <div class="kr-box-title">🇰🇷 우리말 핵심 요약</div>
          <p>${n.krSummary}</p>
        </div>
      </div>
    `;
    return;
  }

  // List View
  if (!newsList.length) {
    container.innerHTML = `
      <div class="empty">
        <p style="font-size:16px; font-weight:700; color:#e2e8f0; margin-bottom:8px;">저장된 뉴스가 없습니다.</p>
        <p style="color:#94a3b8; font-size:14px; margin-bottom:20px;">뉴스를 모두 마스터하셨거나 삭제되었습니다.</p>
        <button class="restore-btn" onclick="restoreDeletedNews()">🔄 삭제한 기본 뉴스 복원하기</button>
      </div>
    `;
    return;
  }

  container.innerHTML = newsList.map(n => `
    <div class="news-card" onclick="currentOpenDate='${n.date}'; renderNews();">
      <div class="news-card-header">
        <div class="news-date">📅 ${n.date} · [${n.field}] ${n.youtubeUrl ? '<span class="yt-badge">📺 영상</span>' : ''}</div>
        <button class="card-del-btn" onclick="event.stopPropagation(); deleteNews('${n.date}');" title="뉴스 삭제">🗑️ 삭제</button>
      </div>
      <div class="news-headline">${n.headline}</div>
      <div class="news-summary-kr">${n.headlineKr}</div>
      <div class="card-footer">
        <span>터치해서 본문 & 단어 학습</span>
        <span>→</span>
      </div>
    </div>
  `).join('') + `
    <div style="text-align:center; margin: 24px 0 12px 0;">
      <button class="restore-btn" onclick="restoreDeletedNews()">🔄 삭제한 기본 뉴스 복원하기</button>
    </div>
  `;
}

function renderVocab() {
  const container = document.getElementById('vocab-container');
  if (!vocabList.length) {
    container.innerHTML = '<div class="empty">저장된 단어가 없습니다.<br>뉴스 본문을 읽다가 모르는 단어를 터치해 보세요!</div>';
    return;
  }
  container.innerHTML = vocabList.map((v, idx) => `
    <div class="vcard">
      <button class="vdel" onclick="deleteWord(${idx})">삭제</button>
      <div class="vword">
        <span>${v.word}</span>
        <button class="audio-btn" style="padding:2px 8px; font-size:11px;" onclick="speak('${v.word}')">🔊</button>
      </div>
      <div class="vdef">${v.def || '뜻을 채우는 중...'}</div>
      <div class="vsrc">출처: ${v.src} (${v.date})</div>
    </div>
  `).join('');
}

function toggleWord(word, srcTitle) {
  if (!word || word.length < 2) return;
  const idx = vocabList.findIndex(v => v.word.toLowerCase() === word.toLowerCase());
  if (idx >= 0) {
    toast(`이미 단어장에 있습니다: ${word}`);
    return;
  }
  const cleanLower = word.toLowerCase();
  const foundDef = DICTIONARY[cleanLower] || `${word} (검색 중...)`;
  vocabList.unshift({
    word: word.charAt(0).toUpperCase() + word.slice(1),
    def: foundDef,
    date: new Date().toISOString().slice(0, 10),
    src: srcTitle.length > 25 ? srcTitle.slice(0, 25) + '...' : srcTitle
  });
  saveStorage();
  toast(`📚 단어장에 저장: ${word}`);
  renderNews();
}

function deleteWord(idx) {
  vocabList.splice(idx, 1);
  saveStorage();
  toast('단어장에서 삭제했습니다.');
  renderVocab();
}

function deleteNews(date) {
  const target = newsList.find(n => n.date === date);
  const headline = target ? target.headline : date;
  if (!confirm(`이 뉴스를 목록에서 삭제하시겠습니까?\n(마스터 완료 또는 원치 않는 뉴스)\n\n• ${date}: ${headline.slice(0, 35)}...`)) {
    return;
  }

  if (!deletedDates.includes(date)) {
    deletedDates.push(date);
    localStorage.setItem('deleted_news_dates', JSON.stringify(deletedDates));
  }

  newsList = newsList.filter(n => n.date !== date);
  saveStorage();
  toast('🗑️ 뉴스를 삭제했습니다.');

  if (currentOpenDate === date) {
    currentOpenDate = null;
  }
  renderNews();
}

function restoreDeletedNews() {
  if (!confirm('삭제했던 기본 뉴스들을 다시 복원하시겠습니까?')) return;
  localStorage.removeItem('deleted_news_dates');
  localStorage.removeItem('news_study_list');
  deletedDates = [];
  newsList = [...DEFAULT_NEWS];
  saveStorage();
  toast('🔄 기본 뉴스가 복원되었습니다.');
  currentOpenDate = null;
  renderNews();
}

function switchTab(t) {
  document.getElementById('tab-news').classList.toggle('active', t === 'news');
  document.getElementById('tab-vocab').classList.toggle('active', t === 'vocab');
  document.getElementById('news-container').style.display = t === 'news' ? 'block' : 'none';
  document.getElementById('vocab-container').style.display = t === 'vocab' ? 'block' : 'none';
  if (t === 'news') renderNews();
  else renderVocab();
}

saveStorage();
renderNews();
</script>
